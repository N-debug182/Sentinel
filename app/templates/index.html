  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    const ctx = document.getElementById("myChart");
    let chart;


    function addData(chart, label, newDatas) {
      chart.data.labels.push(label);
      chart.data.datasets.forEach((dataset, i) => {
        dataset.data.push(newDatas[i]);
      });
      chart.update();
    }

    function removeData(chart) {
      chart.data.labels.shift();
      chart.data.datasets.forEach((dataset) => {
        dataset.data.shift();
      });
      chart.update();
    }


    fetch("/api/measurements")
      .then((res) => res.json())
      .then((data) => {
        console.log(data)
        const rains = data.data.map((each, i) => {
          return each.rainfall
        }).reverse()
        console.log(rains)
        const soil = data.data.map(each => each.humidity).reverse()
        console.log(soil)
        const timestamp = Array.from({ length: data.data.length }, (_, i) => {
              return new Date(data.data[i].timestamp).toLocaleTimeString()
            }
              ,
            )
        const timestamprev = timestamp.reverse()
        chart = new Chart(ctx, {
          type: "line",
          data: {
            labels: timestamprev
            ,
            datasets: [
              {
                label: "rain",
                data: rains,
                borderWidth: 1,
              },
              {
                label: "soil",
                data: soil,
                borderWidth: 1,
              },

            ],
          },
          options: {
            maintainAspectRatio: false,
            scales: {
              y: {
                beginAtZero: true,
              },
            },
          },
        });
      });

    setInterval(() => {
      fetch("/api/measurements/newest")
        .then(res => res.json())
        .then(data => {
          if (data.msg) return
          let now = new Date()
          addData(chart, now.toLocaleTimeString('vi-VN'), [data.rainFall, data.soil])
          if (chart.data.labels.length >=20 ) removeData(chart)
        })
    }, 5000)


    function testPostDataToServer() {

      fetch("/api/measurements/pico_001",

          method: 'POST',

          body: JSON.stringify({

            humidity: Math.floor(Math.random() * 30 + 60),
            temperature: 27

          })
        })
        .then(res => res.json())
        .then(data => console.log(data))

    }
  </script>

        function landslideProbability(slopeAngle, rainfall24h, humidity, treeCover) {
            // --- Step 1: Physical Gates (Veto checks) ---
            // If the slope is too flat (< 15 degrees), a landslide is physically unlikely 
            // regardless of how much it rains.
            if (slopeAngle < 15) {
                return [0.0, "SAFE (Flat Terrain)"];
            }

            // --- Step 2: Normalisation with Non-Linear Curves ---

            // 1. Slope Factor (Degrees): 
            // Risk doesn't grow linearly; it spikes as you get steeper.
            // We use a square function. 45 degrees is extremely steep (100% risk potential).
            // Math.pow(x, 2) makes the curve exponential.
            const slopeNorm = slopeAngle / 60;
            const slopeFactor = Math.pow(slopeNorm, 2);

            // 2. Rain Factor (mm):
            // 135mm is heavy (as discussed), but 250mm+ is catastrophic.
            // We use a simpler linear scale here but capped at 300mm.
            const rainFactor = Math.min(rainfall24h / 300, 1);

            // 3. Humidity Factor:
            // Air humidity is a weak predictor. We treat it as a small bonus multiplier 
            // (if high, soil is likely pre-saturated).
            const humidityFactor = Math.min(humidity / 100, 1);

            // 4. Tree Mitigation Factor:
            // Trees hold soil. 100% cover reduces risk significantly (but not to 0).
            // We will use this to *reduce* the final score.
            const treeMitigation = Math.min(treeCover / 100, 1);

            // --- Step 3: The "Trigger x Susceptibility" Formula ---

            // Base Risk depends heavily on Slope * Rain. 
            // If slope is high but no rain = Low Risk.
            // If rain is high but no slope = Low Risk.
            let rawRisk = (slopeFactor * 0.6) * (rainFactor * 0.4 + humidityFactor * 0.1);

            // Note: The multipliers (0.6, 0.4...) tune the sensitivity. 
            // We multiply Slope * (Rain + Hum) so they depend on each other.

            // Apply Tree Mitigation:
            // Trees can reduce the calculated risk by up to 40% (0.4 multiplier).
            rawRisk = rawRisk * (1 - (treeMitigation * 0.4));

            // Boost the signal: The raw multiplication often results in small numbers (e.g. 0.5 * 0.5 = 0.25).
            // We scale it up to fit a 0-1 probability curve better.

            }
